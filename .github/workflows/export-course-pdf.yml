name: Export course PDFs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lessons/zh/18_axi_subset.ipynb"
      - ".github/workflows/export-course-pdf.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install project dependencies
        run: uv sync --group dev

      - name: Install PDF exporter and browser
        run: |
          uv pip install "nbconvert[webpdf]" pymupdf
          uv run playwright install --with-deps chromium

      - name: Run Mermaid webpdf probe
        run: |
          mkdir -p dist
          uv run python - <<'PY'
          from pathlib import Path
          import nbformat as nbf

          variants = [
              (
                  "A_original_diamond",
                  [
                      "```mermaid",
                      "flowchart TD",
                      '  S["sender: VALID + payload"] --> H{"VALID && READY?"}',
                      '  R["receiver: READY"] --> H',
                      '  H -->|"yes, active clock edge"| T["accepted transfer"]',
                      "```",
                  ],
              ),
              (
                  "B_rectangles",
                  [
                      "```mermaid",
                      "flowchart TD",
                      '  S["sender VALID payload"] --> H["handshake check"]',
                      '  R["receiver READY"] --> H',
                      '  H --> T["accepted transfer"]',
                      "```",
                  ],
              ),
              (
                  "C_graph_td",
                  [
                      "```mermaid",
                      "graph TD",
                      "  S[Sender] --> H[Handshake]",
                      "  R[Receiver] --> H",
                      "  H --> T[Accepted]",
                      "```",
                  ],
              ),
              (
                  "D_flow_lr_ascii",
                  [
                      "```mermaid",
                      "flowchart LR",
                      "  A[Sender] --> B[Handshake]",
                      "  C[Receiver] --> B",
                      "  B --> D[Accepted]",
                      "```",
                  ],
              ),
          ]

          nb = nbf.v4.new_notebook()
          nb.cells = [
              nbf.v4.new_markdown_cell(
                  "# " + title + "\n\n" + "\n".join(diagram_lines)
              )
              for title, diagram_lines in variants
          ]
          Path("dist/mermaid_probe.ipynb").write_text(
              nbf.writes(nb), encoding="utf-8"
          )
          PY

          uv run jupyter nbconvert \
            --to webpdf \
            dist/mermaid_probe.ipynb \
            --output mermaid-probe.pdf \
            --output-dir dist \
            --WebPDFExporter.allow_chromium_download=True

      - name: Upload Mermaid probe
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-webpdf-probe
          path: dist/mermaid-probe.pdf
          if-no-files-found: error
          retention-days: 3

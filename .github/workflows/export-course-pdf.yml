name: Export course PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - "lessons/zh/*.ipynb"
      - "lessons/zh/*homework.md"
      - "exercises/**"
      - ".github/workflows/export-course-pdf.yml"
  pull_request:
    paths:
      - "lessons/zh/*.ipynb"
      - ".github/workflows/export-course-pdf.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"

      - name: Install project dependencies
        run: uv sync --group dev

      - name: Register course Jupyter kernel
        run: |
          uv run python -m ipykernel install --user \
            --name fpga-flybrain \
            --display-name "FPGA FlyBrain"
          uv run jupyter kernelspec list

      - name: Install PDF exporter and browser
        run: |
          uv pip install "nbconvert[webpdf]" pypdf pymupdf
          uv run playwright install --with-deps chromium

      - name: Install HDL tools and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys fonts-noto-cjk
          yosys -V

      - name: Execute notebooks and export PDFs
        run: |
          set -euo pipefail
          mkdir -p dist/course-pdfs
          shopt -s nullglob
          notebooks=(lessons/zh/[0-9][0-9]_*.ipynb)
          if [ "${#notebooks[@]}" -eq 0 ]; then
            echo "No lesson notebooks found" >&2
            exit 1
          fi

          printf 'Exporting %d lesson notebooks:\n' "${#notebooks[@]}"
          printf '  %s\n' "${notebooks[@]}"

          for notebook in "${notebooks[@]}"; do
            uv run jupyter nbconvert \
              --to webpdf \
              --execute "$notebook" \
              --output-dir dist/course-pdfs \
              --ExecutePreprocessor.timeout=180 \
              --WebPDFExporter.allow_chromium_download=True
          done

      - name: Merge course PDF groups
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter

          out = Path("dist/course-pdfs")
          lesson_pdfs = sorted(
              path
              for path in out.glob("[0-9][0-9]_*.pdf")
              if path.stem[:2].isdigit()
          )
          if not lesson_pdfs:
              raise SystemExit("No lesson PDFs were generated")

          by_number = {int(path.stem[:2]): path for path in lesson_pdfs}

          def merge(start: int, end: int, filename: str) -> None:
              selected = [
                  by_number[number]
                  for number in range(start, end + 1)
                  if number in by_number
              ]
              expected = end - start + 1
              if len(selected) != expected:
                  missing = [
                      number
                      for number in range(start, end + 1)
                      if number not in by_number
                  ]
                  raise SystemExit(f"Missing lesson PDFs for {filename}: {missing}")

              writer = PdfWriter()
              for path in selected:
                  reader = PdfReader(str(path))
                  for page in reader.pages:
                      writer.add_page(page)

              combined = out / filename
              with combined.open("wb") as handle:
                  writer.write(handle)
              print(f"Wrote {combined} from {len(selected)} lessons")

          merge(1, 4, "FPGA-FlyBrain-lessons-01-04-zh.pdf")
          merge(5, 12, "FPGA-FlyBrain-lessons-05-12-zh.pdf")
          merge(13, 18, "FPGA-FlyBrain-lessons-13-18-zh.pdf")
          merge(19, 23, "FPGA-FlyBrain-lessons-19-23-zh.pdf")
          merge(1, 18, "FPGA-FlyBrain-lessons-01-18-zh.pdf")
          merge(1, 23, "FPGA-FlyBrain-lessons-01-23-zh.pdf")
          PY

      - name: Verify Lesson 13 synthesis output is present
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          path = Path("dist/course-pdfs/13_simulation_is_not_chip.pdf")
          text = "\n".join(
              page.extract_text() or ""
              for page in PdfReader(str(path)).pages
          )
          required = (
              "Yosys synthesis succeeded.",
              "clocked_accumulator",
              "Structural check problems: 0",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(
                  f"Lesson 13 PDF is missing synthesis evidence: {missing}"
              )
          print("Lesson 13 PDF contains real synthesis evidence.")
          PY

      - name: Verify course diagrams are rendered
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import pymupdf

          mermaid_checks = (
              "13_simulation_is_not_chip.pdf",
              "15_host_talks_to_fpga.pdf",
              "16_data_movement_cost.pdf",
              "17_external_memory_ddr.pdf",
          )

          for filename in mermaid_checks:
              path = Path("dist/course-pdfs") / filename
              document = pymupdf.open(path)
              text = "\n".join(page.get_text("text") for page in document)
              leaked = [
                  marker
                  for marker in ("flowchart LR", "flowchart TD", "graph TD")
                  if marker in text
              ]
              if leaked:
                  raise SystemExit(
                      f"{filename} contains Mermaid source instead of a rendered diagram: "
                      f"{leaked}"
                  )

              mermaid_errors = [
                  marker
                  for marker in ("Syntax error in text", "mermaid version")
                  if marker in text
              ]
              if mermaid_errors:
                  raise SystemExit(
                      f"{filename} contains a Mermaid render error: {mermaid_errors}"
                  )

              def count_lavender(page):
                  pixmap = page.get_pixmap(alpha=False)
                  samples = pixmap.samples
                  channels = pixmap.n
                  count = 0
                  for index in range(0, len(samples), channels):
                      red, green, blue = (
                          samples[index],
                          samples[index + 1],
                          samples[index + 2],
                      )
                      if (
                          red >= 180
                          and green >= 180
                          and blue >= 230
                          and blue - red >= 8
                          and blue - green >= 8
                      ):
                          count += 1
                  return count

              page_lavender = [count_lavender(page) for page in document]
              lavender_pixels = sum(page_lavender)

              if lavender_pixels < 400:
                  raise SystemExit(
                      f"{filename} does not contain enough rendered "
                      f"diagram-colored pixels: {lavender_pixels}"
                  )

              print(
                  f"{filename}: diagram source/error text is absent and "
                  f"{lavender_pixels} rendered diagram pixels were detected."
              )


          # Revised Lesson 14 and Platform 5 standardize course diagrams on
          # inline SVG. Use a dedicated pale-green fill (#e6f4ea) so PDF
          # verification can distinguish real rendering from syntax colors.
          green_svg_checks = (
              "14_what_is_fpga_board.pdf",
              "19_what_is_connectome.pdf",
              "20_load_malecns_subset.pdf",
              "21_scaling_bottlenecks.pdf",
              "22_closed_loop_world.pdf",
              "23_cpu_gpu_fpga_benchmark.pdf",
          )

          def count_green_svg_fill(page):
              pixmap = page.get_pixmap(alpha=False)
              samples = pixmap.samples
              channels = pixmap.n
              count = 0
              for index in range(0, len(samples), channels):
                  red, green, blue = (
                      samples[index],
                      samples[index + 1],
                      samples[index + 2],
                  )
                  # Inline SVG box fill is #e6f4ea = (230, 244, 234).
                  if (
                      220 <= red <= 240
                      and 238 <= green <= 250
                      and 225 <= blue <= 245
                      and green - red >= 4
                      and green - blue >= 4
                  ):
                      count += 1
              return count

          for filename in green_svg_checks:
              path = Path("dist/course-pdfs") / filename
              document = pymupdf.open(path)
              text = "\n".join(page.get_text("text") for page in document)

              leaked_svg = [
                  marker for marker in ("<svg", "<rect", "<path", "<defs")
                  if marker in text
              ]
              if leaked_svg:
                  raise SystemExit(
                      f"{filename} contains escaped SVG source: {leaked_svg}"
                  )

              rendered_pixels = sum(
                  count_green_svg_fill(page) for page in document
              )
              if rendered_pixels < 1500:
                  raise SystemExit(
                      f"{filename} is missing a visibly rendered inline SVG: "
                      f"{rendered_pixels} SVG-fill pixels"
                  )

              print(
                  f"{filename}: inline SVG visibly rendered with "
                  f"{rendered_pixels} dedicated SVG-fill pixels."
              )


          # Lesson 18 uses inline SVG for its two protocol diagrams.
          # Attachment URLs were experimentally shown to break under webpdf,
          # so verify that the inline SVG fill is actually visible on each
          # corresponding PDF page.
          lesson18 = pymupdf.open(Path("dist/course-pdfs/18_axi_subset.pdf"))
          lesson18_text = "\n".join(page.get_text("text") for page in lesson18)
          leaked_svg = [
              marker for marker in ("<svg", "<rect", "<path")
              if marker in lesson18_text
          ]
          if leaked_svg:
              raise SystemExit(
                  f"Lesson 18 PDF contains escaped SVG source: {leaked_svg}"
              )

          def count_inline_svg_fill(page):
              pixmap = page.get_pixmap(alpha=False)
              samples = pixmap.samples
              channels = pixmap.n
              count = 0
              for index in range(0, len(samples), channels):
                  red, green, blue = (
                      samples[index],
                      samples[index + 1],
                      samples[index + 2],
                  )
                  # The inline SVG boxes use #eef0ff. Allow a small range for
                  # browser/PDF color conversion while staying much stricter
                  # than generic syntax-highlighting colors.
                  if (
                      232 <= red <= 245
                      and 234 <= green <= 247
                      and blue >= 248
                      and blue - red >= 6
                      and blue - green >= 4
                  ):
                      count += 1
              return count

          checks = (
              ("VALID=1", "handshake inline SVG"),
              ("burst transaction", "transaction/burst/beat inline SVG"),
          )

          for marker, label in checks:
              candidates = [
                  (page, count_inline_svg_fill(page))
                  for page in lesson18
                  if marker in page.get_text("text")
              ]
              if not candidates:
                  raise SystemExit(
                      f"Lesson 18 PDF has no page for {label}: marker={marker!r}"
                  )
              rendered_pixels = max(count for _, count in candidates)
              if rendered_pixels < 1000:
                  raise SystemExit(
                      f"Lesson 18 {label} is not visibly rendered: "
                      f"{rendered_pixels} SVG-fill pixels"
                  )
              print(
                  f"Lesson 18 {label}: {rendered_pixels} SVG-fill pixels."
              )
          PY

      - name: List generated files
        if: always()
        run: ls -lh dist/course-pdfs || true

      - name: Upload course PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FPGA-FlyBrain-course-pdfs-zh
          path: dist/course-pdfs/*.pdf
          if-no-files-found: error
          retention-days: 30

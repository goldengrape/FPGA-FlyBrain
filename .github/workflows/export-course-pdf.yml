name: Export course PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - "lessons/zh/*.ipynb"
      - "lessons/zh/*homework.md"
      - "exercises/**"
      - ".github/workflows/export-course-pdf.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install project dependencies
        run: uv sync --group dev

      - name: Install PDF exporter and browser
        run: |
          uv pip install "nbconvert[webpdf]" pypdf
          uv run playwright install --with-deps chromium

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Execute notebooks and export PDFs
        run: |
          mkdir -p dist/course-pdfs
          for notebook in \
            lessons/zh/01_membrane_to_lif.ipynb \
            lessons/zh/02_float_to_fixed.ipynb \
            lessons/zh/03_freeze_neuron_semantics.ipynb \
            lessons/zh/04_state_and_clock.ipynb \
            lessons/zh/05_logic_building_blocks.ipynb \
            lessons/zh/06_what_is_rtl.ipynb \
            lessons/zh/07_first_rtl_neuron.ipynb \
            lessons/zh/08_testbench_waveform_simulation.ipynb \
            lessons/zh/09_time_multiplex_many_neurons.ipynb \
            lessons/zh/10_spike_fifo_backpressure.ipynb \
            lessons/zh/11_sparse_synapse_lookup.ipynb \
            lessons/zh/12_one_spike_journey.ipynb
          do
            uv run jupyter nbconvert \
              --to webpdf \
              --execute "$notebook" \
              --output-dir dist/course-pdfs \
              --ExecutePreprocessor.timeout=180 \
              --WebPDFExporter.allow_chromium_download=True
          done

      - name: Merge lessons 01-04
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter

          out = Path("dist/course-pdfs")
          names = [
              "01_membrane_to_lif.pdf",
              "02_float_to_fixed.pdf",
              "03_freeze_neuron_semantics.pdf",
              "04_state_and_clock.pdf",
          ]
          writer = PdfWriter()
          for name in names:
              path = out / name
              reader = PdfReader(str(path))
              for page in reader.pages:
                  writer.add_page(page)
          combined = out / "FPGA-FlyBrain-lessons-01-04-zh.pdf"
          with combined.open("wb") as f:
              writer.write(f)
          print(f"Wrote {combined}")
          PY

      - name: Merge lessons 05-12
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter

          out = Path("dist/course-pdfs")
          names = [
              "05_logic_building_blocks.pdf",
              "06_what_is_rtl.pdf",
              "07_first_rtl_neuron.pdf",
              "08_testbench_waveform_simulation.pdf",
              "09_time_multiplex_many_neurons.pdf",
              "10_spike_fifo_backpressure.pdf",
              "11_sparse_synapse_lookup.pdf",
              "12_one_spike_journey.pdf",
          ]
          writer = PdfWriter()
          for name in names:
              path = out / name
              reader = PdfReader(str(path))
              for page in reader.pages:
                  writer.add_page(page)
          combined = out / "FPGA-FlyBrain-lessons-05-12-zh.pdf"
          with combined.open("wb") as f:
              writer.write(f)
          print(f"Wrote {combined}")
          PY

      - name: Merge lessons 01-12
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter

          out = Path("dist/course-pdfs")
          names = [
              "01_membrane_to_lif.pdf",
              "02_float_to_fixed.pdf",
              "03_freeze_neuron_semantics.pdf",
              "04_state_and_clock.pdf",
              "05_logic_building_blocks.pdf",
              "06_what_is_rtl.pdf",
              "07_first_rtl_neuron.pdf",
              "08_testbench_waveform_simulation.pdf",
              "09_time_multiplex_many_neurons.pdf",
              "10_spike_fifo_backpressure.pdf",
              "11_sparse_synapse_lookup.pdf",
              "12_one_spike_journey.pdf",
          ]
          writer = PdfWriter()
          for name in names:
              path = out / name
              reader = PdfReader(str(path))
              for page in reader.pages:
                  writer.add_page(page)
          combined = out / "FPGA-FlyBrain-lessons-01-12-zh.pdf"
          with combined.open("wb") as f:
              writer.write(f)
          print(f"Wrote {combined}")
          PY

      - name: List generated files
        run: ls -lh dist/course-pdfs

      - name: Upload course PDFs
        uses: actions/upload-artifact@v4
        with:
          name: FPGA-FlyBrain-course-pdfs-zh
          path: dist/course-pdfs/*.pdf
          if-no-files-found: error
          retention-days: 30

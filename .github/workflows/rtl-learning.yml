name: RTL Learning Checks

on:
  push:
    branches:
      - main
    paths:
      - "rtl/**"
      - "tb/**"
      - "scripts/check_rtl_learning.sh"
      - ".github/workflows/rtl-learning.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl-learning:
    name: Icarus + Verilator + Yosys
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install open-source HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys

      - name: Run RTL learning checks
        run: ./scripts/check_rtl_learning.sh

      - name: Upload Lesson 8 waveform
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lesson08-vcd
          path: build/rtl-learning/lesson08/tutorial_if_neuron.vcd
          if-no-files-found: error
          retention-days: 7

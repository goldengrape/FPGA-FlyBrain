name: Audit source snapshot

on:
  push:
    branches:
      - audit/kv260-doc-code-review

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove git metadata
        run: rm -rf .git
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fpga-flybrain-audit-source
          path: .
          include-hidden-files: true
          retention-days: 1

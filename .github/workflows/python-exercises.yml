name: Python exercise infrastructure

on:
  push:
    paths:
      - "exercises/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-exercises.yml"
  pull_request:
    paths:
      - "exercises/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-exercises.yml"

jobs:
  exercise-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --group dev
      - name: Check graders and notebook structure
        run: uv run pytest exercises/checks/test_graders.py exercises/checks/test_notebook_structure.py -q
